<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>Recuperar Senha — Chat FECIP 2026</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsivo.css">
</head>
<body>
  <header class="navbar">
    <a href="/" class="brand">
      <div class="brand-icon">💬</div>
      <div>
        <span class="brand-title">Chat Tradução</span>
        <span class="brand-subtitle">FECIP 2026</span>
      </div>
    </a>
  </header>

  <main class="main-content" style="max-width: 460px;">
    <!-- Cenário D: Cássio esquece a senha -->
    <div class="card" id="card-solicitar">
      <h1 class="card-title">Recuperação de Senha</h1>
      <p class="card-subtitle">Informe seu e-mail para receber um link de redefinição com validade de 1 hora.</p>

      <div id="alerta-solicitar-ok" class="banner banner-success" style="display: none;"></div>
      <div id="alerta-solicitar-erro" class="banner banner-danger" style="display: none;"></div>

      <form id="form-solicitar" onsubmit="return false;">
        <div class="form-group">
          <label class="form-label" for="reset-email">E-mail Cadastrado</label>
          <input type="email" id="reset-email" class="form-control" placeholder="seu@email.com" required autofocus>
        </div>
        <button id="btn-solicitar" type="submit" class="btn btn-primary btn-block">Enviar Link de Recuperação</button>
      </form>

      <div id="preview-box" style="margin-top: 16px; font-size: 0.82rem; color: #64748b; display: none;"></div>
    </div>

    <!-- Formulário que aparece quando acessado com token: ?token=XYZ -->
    <div class="card" id="card-nova-senha" style="display: none;">
      <h1 class="card-title">Cadastrar Nova Senha</h1>
      <p class="card-subtitle">Crie sua nova senha para acessar a conta.</p>

      <div id="alerta-senha-ok" class="banner banner-success" style="display: none;"></div>
      <div id="alerta-senha-erro" class="banner banner-danger" style="display: none;"></div>

      <form id="form-nova-senha" onsubmit="return false;">
        <div class="form-group">
          <label class="form-label" for="nova-senha">Nova Senha (3 a 50 caracteres)</label>
          <input type="password" id="nova-senha" class="form-control" placeholder="Digite sua nova senha" minlength="3" maxlength="50" required autofocus>
        </div>
        <button id="btn-salvar-senha" type="submit" class="btn btn-primary btn-block">Salvar Nova Senha</button>
      </form>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (token) {
      document.getElementById('card-solicitar').style.display = 'none';
      document.getElementById('card-nova-senha').style.display = 'block';

      document.getElementById('form-nova-senha').addEventListener('submit', async (e) => {
        e.preventDefault();
        const novaSenha = document.getElementById('nova-senha').value;

        const res = await fetch('/api/auth/nova-senha', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, novaSenha })
        });
        const data = await res.json();

        if (res.ok && data.sucesso) {
          document.getElementById('alerta-senha-ok').textContent = data.mensagem;
          document.getElementById('alerta-senha-ok').style.display = 'block';
          document.getElementById('alerta-senha-erro').style.display = 'none';
          setTimeout(() => window.location.href = '/', 1500);
        } else {
          document.getElementById('alerta-senha-erro').textContent = data.erro || 'Erro ao redefinir senha.';
          document.getElementById('alerta-senha-erro').style.display = 'block';
        }
      });
    } else {
      document.getElementById('form-solicitar').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('reset-email').value.trim();

        const res = await fetch('/api/auth/reset-senha', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (res.ok) {
          document.getElementById('alerta-solicitar-ok').textContent = data.mensagem;
          document.getElementById('alerta-solicitar-ok').style.display = 'block';
          document.getElementById('alerta-solicitar-erro').style.display = 'none';

          const pbox = document.getElementById('preview-box');
          pbox.style.display = 'block';
          pbox.innerHTML = '✉️ O link foi enviado com sucesso para a sua caixa de entrada do e-mail.';
        } else {
          document.getElementById('alerta-solicitar-erro').textContent = data.erro || 'Falha ao solicitar redefinição.';
          document.getElementById('alerta-solicitar-erro').style.display = 'block';
        }
      });
    }
  </script>
</body>
</html>
